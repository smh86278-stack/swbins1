<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://gmail.googleapis.com https://www.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;C 메신저</title>
<meta name="description" content="메일로 일을 맡기는 메신저형 보내기 화면">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D&amp;C 메신저">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B2018" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* 디스패치 — 폰(아이폰 Safari)에서 쓰는 '보내기' 화면. 서버가 없다: 보내기를 누르면 메일 앱이 제목·본문이 채워진 채 열리고,
   보내기만 누르면 PC 의 메일 게이트웨이가 받아 일을 시작한다. 답은 메일로 온다(메일 안의 단추로 바로 답장).
   설정에 Google 클라이언트 ID 를 넣고 연결하면 메일 앱 대신 Gmail API 로 바로 보내고, PC 의 회신을 받아 말풍선으로 띄운다.
   이 페이지에는 메일 주소·업무 내용이 들어 있지 않다 — 주소는 처음 한 번 입력하면 이 기기에만 남는다. */
/* 공통 디자인 「책등」(2026-11-20 — 정본 C:\swbins-pub\design-draft\identity\SPEC.md, PC 메신저 pc/ui.html 과 같은 색):
   거의 흰 쑥 바탕 + 먹색 글씨 + 오른쪽 끝 먹색 세로 책등(「메신저」·D&C). 모서리 0·그림자 없음, 주 단추 오른쪽 4px 등.
   <html data-theme=light|dark> 는 밝기(자동 19~07시 어둡게·밝게·어둡게) — color-scheme 을 정해 light-dark() 가 그쪽 값을 고른다.
   data-base(바탕: 책등·크라프트지)·data-accent(강조: 먹·남색·초록·자주·황토)는 설정에서 고르고 이 기기에 기억한다(app.js look). */
@font-face{font-family:"Sunflower";src:url(sunflower-medium-ks.woff2) format("woff2");font-display:swap}
:root{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
:root{
  --bg:light-dark(#EEF3EA,#1B2018);--solid:light-dark(#FAFBF7,#151A13);--panel:var(--bg);--soft:light-dark(#E2E8D8,#2C3527);
  --face:light-dark(#E2E8D8,#2C3527);--b3:light-dark(#CDD5C0,#3A4433);
  --text:light-dark(#2A3324,#DEE5D3);--muted:light-dark(#5A6650,#A4AE97);--line:light-dark(#D6DCCB,#2F382A);
  --field:light-dark(#9AA48E,#56604E);
  --spine:light-dark(#2F3A3A,#5A6D69);--onspine:light-dark(#E9EEE2,#EEF2E8);
  --edge:light-dark(#2A3324,#A4AE97);--rule:var(--edge);--spine-w:32px;
  /* 글씨·선으로 쓰는 강조(어둡게에선 책등 색이 바탕과 3:1 이라 글씨와 섞어 밝힌다) */
  --accent:light-dark(var(--spine),color-mix(in srgb,var(--spine) 45%,var(--text)));--accentsoft:var(--face);--onaccent:var(--onspine);
  --warn:light-dark(#7D5A12,#C9A866);--ok:light-dark(#2F6B4F,#8FBB9E);--bad:light-dark(#8A4A3A,#C98A78);
  --serif:var(--sans);
  --display:"Sunflower","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --sans:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
}
/* 바탕 — 책등(기본)은 위 그대로. 크라프트지는 바탕 값만 바뀌고 책등 모양·글꼴·움직임은 그대로 */
:root[data-base=kraft]{--bg:light-dark(#E9DEC9,#221D16);--solid:light-dark(#F5ECDC,#2A241B);--soft:light-dark(#DED1B9,#302920);--face:var(--soft);
  --b3:light-dark(#D5C6AA,#3A3226);--text:light-dark(#2E2418,#EFE4CF);--muted:light-dark(#6B5C47,#B6A68B);--line:light-dark(#CFBFA3,#3E3527);
  --field:light-dark(#A8977A,#62563F);--edge:light-dark(#2E2418,#B6A68B)}
/* 강조 — 책등·주 단추·고른 탭 색(먹은 위 그대로). 책등 위 글씨는 그대로 */
:root[data-accent=ink]{--spine:light-dark(#2F5283,#4D6C98)}
:root[data-accent=pine]{--spine:light-dark(#2F6B4F,#45745E)}
:root[data-accent=plum]{--spine:light-dark(#7B3A6B,#905784)}
:root[data-accent=ochre]{--spine:light-dark(#7D5A12,#83652D)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--text);font:16px/1.5 var(--sans);background:var(--bg);display:flex;flex-direction:column;min-height:100dvh;padding-right:var(--spine-w)}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.logo{width:26px;height:26px;display:grid;place-items:center;flex:none;color:var(--accent)}
.logo svg{width:20px;height:20px}
h1{font:700 18px/1.25 var(--serif);margin:0}
.sub{color:var(--muted);font-size:12px}
.icon-btn{margin-left:auto;border:1px solid var(--field);background:transparent;border-radius:0;padding:4px 10px;font-size:14px;font-weight:400}

/* 보낸 기록 — 말풍선 */
#log{flex:1;overflow:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
/* 펫이 보이면 대화 끝에 펫 키만큼 빈자리 — 맨 아래 말풍선·방이 입력칸 위 펫에 가리지 않고 그 위로 올라온다 */
#log::after{content:"";flex:none;height:0}
body:has(#petStage:not(.off)) #log::after{height:96px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;max-width:300px}
.empty b{color:var(--text);font-family:var(--serif)}
.day{align-self:stretch;display:flex;align-items:center;gap:10px;font:12px/1.4 var(--serif);color:var(--muted)}
.day::before,.day::after{content:"";flex:1;border-top:1px solid var(--line)}
.tail{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.tail a{color:var(--accent);font-weight:700;text-decoration:none;margin-left:6px}
/* Gmail 로 주고받을 때 — PC(봇) 말풍선은 왼쪽 */
.msg.bot{align-self:flex-start;align-items:flex-start}
.bubble.bot{background:var(--solid);color:var(--text);border:1px solid var(--line)}
.bubble.wait{opacity:.55}
.bubble.typing{color:var(--muted);font-size:14px}
.ask{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;align-items:flex-start;white-space:normal}
.ask .q{font-weight:700;font-size:14px;font-family:var(--serif)}
.opt{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:0;padding:6px 12px;font-size:14px;font-weight:400;text-align:left}
.opt.on{background:var(--accentsoft);color:var(--text);border-color:var(--accent)}
#gbar{display:none;margin:8px 16px 0;padding:8px 12px;border-radius:0;font-size:13px;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--warn) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-left-width:3px}
#gbar.on{display:flex}
#gbar button{margin-left:auto;flex:none}
/* 대화방 목록 — 카드 대신 가로줄 */
#log:has(> .room){gap:0}
#log:has(> .room) > .tail{margin-top:10px}
.room{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;
  background:transparent;border-radius:0;padding:11px 10px;flex:none}
.room .tagchip{flex:none;margin-top:3px}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtop,.rbot{display:flex;gap:6px;align-items:center;min-width:0}
.rtitle{flex:1;min-width:0;font:700 15.5px/1.35 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rlast{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rst{flex:none;font-size:11px;font-weight:700;border-radius:0;padding:0 5px;border:1px solid var(--line);color:var(--muted)}
.rst.ask{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.rst.err{color:var(--bad)}.rst.busy{color:var(--ok)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.unread{color:var(--accent);font-weight:700}
.tail.warn{color:var(--warn)}
.quick{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.quick .chip{flex:none}
.typingrow{display:flex;gap:8px;align-items:center}
/* 목록 편집(여러 방 지우기) */
.chk{flex:none;width:20px;height:20px;border-radius:0;border:1.5px solid var(--field);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--onaccent);margin-top:2px}
.room.sel{background:var(--accentsoft);border-left-color:var(--accent)}
.room.sel .chk{background:var(--accent);border-color:var(--accent)}
#editBar{display:none;gap:8px;position:sticky;bottom:0;background:var(--bg);
  border-top:2px solid var(--rule);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
#editBar.on{display:flex}
#editBar .btn{flex:1}
#editBar .btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}
#editBar .btn:disabled{opacity:.45}
/* PC 답 보기 좋게(표·목록·코드) · 긴 답 접기 */
.bubble.md{white-space:normal}
.md .h{font-weight:700;margin:6px 0 2px;font-family:var(--serif)}
.md .li{display:flex;gap:6px}
.md .bul{flex:none;color:var(--muted)}
.md .sp{height:6px}
.md code{font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:0;padding:1px 5px;overflow-wrap:anywhere}
.md td code{white-space:nowrap;overflow-wrap:normal}      /* 표 안 코드는 가르지 않는다(표는 옆으로 밀린다) */
.md pre{background:var(--soft);border-radius:0;padding:8px 10px;overflow-x:auto;margin:6px 0}
.md pre code{background:none;padding:0;white-space:pre;word-break:normal}
.md .tbl{overflow-x:auto;margin:6px 0;max-width:100%}
.md table{border-collapse:collapse;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.md th{background:var(--soft);white-space:nowrap}
.mdbody.fold{max-height:300px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:6px 0 0}
/* 방 고정 · 검색 */
#searchBar{display:none;padding:10px 16px 0}
#searchBar.on{display:block}
#searchBar input{border-radius:0;border:0;border-bottom:1px solid var(--field);background:transparent;padding:8px 2px;font-size:16px}
.pin{flex:none;font-size:12px}
/* 사진 붙이기 */
.clip{flex:none;width:44px;height:44px;border-radius:0;border:1px solid var(--field);background:transparent;font-size:19px;display:grid;place-items:center}
#attPrev{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;padding-top:6px}
.thumb{position:relative;flex:none}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:0;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:11px;line-height:20px;padding:0}
.back{border:0;background:none;font-size:30px;line-height:1;padding:0 2px 4px 0;color:var(--text);font-weight:400}
header .ttl{min-width:0;flex:1}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{align-self:flex-end;max-width:85%;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bubble{background:var(--accentsoft);color:var(--text);border-radius:0;padding:9px 13px;white-space:pre-wrap;word-break:break-word}
.meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tagchip{font-size:10.5px;font-weight:700;border-radius:0;padding:0 5px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}
.tagchip.w{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.again{border:0;background:none;color:var(--accent);font-size:11px;font-weight:700;padding:0}

/* 입력부 */
.composer{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--rule);padding:8px 12px calc(env(safe-area-inset-bottom) + 10px)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:4px 2px 6px;margin-bottom:-1px;font-size:14px;font-weight:400;color:var(--muted)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:0;padding:3px 10px;font-size:13px;font-weight:400;color:var(--muted)}
.chip.on{background:var(--accentsoft);border-color:var(--accent);color:var(--text)}
.chip.on.w{background:color-mix(in srgb,var(--warn) 12%,var(--bg));border-color:var(--warn);color:var(--text)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text],input[type=email],input[type=number],input[type=password]{width:100%;background:var(--solid);border:1px solid var(--line);border-radius:0;padding:9px 12px;outline:none;
  font-size:16px}  /* 16px 미만이면 iOS 가 확대한다 */
textarea{resize:none;max-height:140px;min-height:44px}
textarea:focus,input:focus{border-color:var(--text)}
.send{flex:none;width:44px;height:44px;border-radius:0;border:1px solid var(--rule);background:var(--rule);color:var(--bg);display:grid;place-items:center}
.send:disabled{opacity:.35}
.send svg{width:20px;height:20px}
.pane{display:none}.pane.on{display:block}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.pick{border:1px solid var(--line);background:transparent;border-radius:0;padding:9px 0;font:700 16px/1.2 var(--serif);color:var(--muted);display:flex;gap:5px;justify-content:center;align-items:center}
.pick.on{background:var(--accentsoft);border-color:var(--accent);color:var(--text)}
.pick .box{width:16px;height:16px;border-radius:0;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1;font-family:var(--sans)}
.inline{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.inline label{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:400}
.prefix{display:flex;align-items:center;background:var(--solid);border:1px solid var(--line);border-radius:0;padding-left:12px;flex:1}
.prefix span{color:var(--muted);font-weight:700}
.prefix input{border:0;box-shadow:none!important;background:transparent;padding-left:2px}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.stopbtn{border:1px solid var(--field);background:transparent;border-radius:0;padding:3px 10px;font-size:13px;font-weight:400;color:var(--muted)}
.stopbtn.on{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--bg))}

/* 설정 */
dialog{border:1px solid var(--line);border-top:2px solid var(--rule);border-radius:0;padding:0;width:min(420px,calc(100vw - 32px));background:var(--solid);color:var(--text)}
dialog::backdrop{background:rgba(30,25,20,.4)}
.dlg{padding:18px}
.dlg h2{margin:0 0 4px;font:700 20px/1.3 var(--serif)}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--field);background:transparent;border-radius:0;padding:7px 16px;font-weight:400}
.btn.pri{background:var(--rule);border-color:var(--rule);color:var(--bg)}
.dlg input[type=checkbox]{accent-color:var(--text)}
.dlg button[type=button]:not(.btn){border:1px solid var(--field);background:transparent;border-radius:0;padding:0 12px}
/* 바탕 테마 · 강조색 고르기 */
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:0;padding:5px 10px;font-size:13px;font-weight:400;color:var(--muted)}
.swatches i{width:13px;height:13px;border-radius:0;border:1px solid var(--line);flex:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-10px);opacity:0;background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:0;font-size:14px;transition:.25s;pointer-events:none;max-width:85vw;text-align:center}
#toast.show{opacity:.95;transform:translate(-50%,0)}
/* 인형 강아지·고양이(D&C 허브와 같은 그림, pet/) — 머리줄 아래. 누르면 쓰다듬기, 보내면 반긴다 */
.petstage{position:fixed;inset:0;z-index:4;pointer-events:none}
.petstage.off{display:none}
.petstage .pet{width:84px;position:absolute;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.petstage .pet.dragging{filter:drop-shadow(0 8px 10px rgba(40,30,20,.3));transition:none}
.msg .meta .del{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:0 4px;cursor:pointer}
.field select{width:100%;font:inherit;padding:9px 10px;border-radius:0;border:1px solid var(--line);background:var(--bg);color:var(--text)}

/* 오르카 결(11-25) — 요약줄 · 걸린 시간 · 상세 시트 */
#sumBar{display:none;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
#sumBar.on{display:flex}
#sumBar button{border:1px solid var(--line);background:transparent;color:var(--text);padding:3px 10px;font-size:13px;font-weight:400;border-radius:0}
#sumBar button.wait b{color:var(--bad)}
#sumBar button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
#sumBar button.on b{color:inherit}
header .ttl.tap{cursor:pointer}
header .ttl.tap .sub::after{content:" · 상세 ›";color:var(--text)}
.worked{align-self:flex-start;font-size:11px;color:var(--muted);margin:-4px 4px -6px;font-variant-numeric:tabular-nums}
#infoDlg{margin:auto 0 0;width:100%;max-width:100%;max-height:82vh;border:0;border-top:3px solid var(--text);padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);overflow:auto}
#infoDlg::backdrop{background:rgba(0,0,0,.35)}
#infoDlg h3{margin:0 34px 4px 0;font-size:16px;line-height:1.35}
#infoDlg .x{position:absolute;top:10px;right:12px;border:0;background:transparent;color:var(--muted);font-size:20px;padding:4px 8px}
#infoDlg .sec{margin:14px 0 6px;font-size:11px;color:var(--muted)}
#infoDlg .needs{margin:8px 0 0;padding:7px 10px;border:1px solid var(--bad);color:var(--bad);font-weight:700;font-size:14px}
#infoDlg .task{margin:0;padding:8px 10px;background:var(--face,var(--solid));white-space:pre-wrap;word-break:break-word;font-size:14px;max-height:9em;overflow:auto}
#infoDlg dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 8px;margin:0;font-size:14px}
#infoDlg dt{color:var(--muted)}#infoDlg dd{margin:0}
#infoDlg ol{list-style:none;margin:0;padding:0;font-size:14px}
#infoDlg li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
#infoDlg li i{width:8px;height:8px;margin-top:6px;border-radius:50%;border:1.5px solid var(--muted)}
#infoDlg li.k-ask i,#infoDlg li.k-confirm i{border-color:var(--bad);background:var(--bad)}
#infoDlg li.k-done i{border-color:var(--ok);background:var(--ok)}
#infoDlg li.k-error i{border-color:var(--bad)}
#infoDlg li small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#infoDlg li time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt .rec{margin-left:8px;padding:0 6px;border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:700}
.opt.recd{border-color:var(--accent)}

/* 오르카 결 3차 — 완료 기준 */
#doneBox{display:none;margin-top:8px}
#doneBox.on{display:block}
#doneBox textarea{border-style:dashed;background:transparent;font-size:14px}
#infoDlg ul.crit{list-style:none;margin:0;padding:0;font-size:14px}
#infoDlg ul.crit li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
#infoDlg ul.crit .m{flex:none;width:1.2em;color:var(--muted)}
#infoDlg ul.crit .m.ok{color:var(--ok)}#infoDlg ul.crit .m.no{color:var(--bad)}
#infoDlg ul.crit small{display:block;color:var(--muted);font-size:12px}
</style>
<style>
/* ---------- 책등 — 머리·발 굵은 먹선 3px, 고른 것은 책등 색, 주 단추 오른쪽 4px 등, 모서리 0 ---------- */
body :not(.petstage,.petstage *){border-radius:0!important}
header{border-bottom:3px solid var(--rule)}
.composer,#editBar{border-top:3px solid var(--rule)}
dialog{border-top:3px solid var(--rule)}
dialog::backdrop{background:rgba(27,32,24,.45)}
h1,.dlg h2{font-family:var(--display);font-weight:400;letter-spacing:0}
.tabs button.on{border-bottom:3px solid var(--spine);font-weight:400}
.chip.on,.pick.on,.dlg .swatches button.on{background:var(--spine);border-color:var(--spine);color:var(--onspine)}
.chip.on.w{background:var(--face);border-color:var(--warn);color:var(--text);box-shadow:inset -4px 0 0 var(--warn)}
.pick{font:400 16px/1.2 var(--display)}
.opt.on{background:var(--face);border-color:var(--spine);box-shadow:inset -4px 0 0 var(--edge)}
.room.sel{background:var(--face);border-left-color:var(--spine)}
.room.sel .chk{background:var(--spine);border-color:var(--spine);color:var(--onspine)}
.field label{font-weight:400}
.bubble:not(.bot){background:var(--face);box-shadow:inset -4px 0 0 var(--spine)}
.dot{background:var(--spine)}
/* 주 단추 — 책등 색, 오른쪽 끝 4px 등 */
.send,.btn.pri{background:var(--spine);border-color:var(--spine);color:var(--onspine);box-shadow:inset -4px 0 0 var(--edge)}
.btn.pri{font-family:var(--display);font-weight:400}
.dlg input[type=checkbox],input[type=checkbox]{accent-color:var(--spine)}
textarea:focus,input:focus{border-color:var(--spine)}
#toast{background:var(--spine);color:var(--onspine);box-shadow:inset -4px 0 0 var(--edge);left:calc(50% - var(--spine-w) / 2)}
.petstage{right:var(--spine-w)}
/* 책등 — 오른쪽 끝 세로 띠(폰 32px), 제품 이름을 한글로 세워 쓴다. 아래 작은 글씨 D&C */
.spine{position:fixed;top:0;right:0;bottom:0;width:var(--spine-w);z-index:6;background:var(--spine);color:var(--onspine);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 16px) 0 calc(env(safe-area-inset-bottom) + 12px);user-select:none;-webkit-user-select:none;overflow:hidden;pointer-events:none}
.spine .vt{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.12em;font-family:var(--display);font-weight:400;font-size:15px}
.spine small{writing-mode:vertical-rl;font-size:10px;font-weight:400;letter-spacing:.1em;opacity:.85}
/* 단추 — 누르면 책을 빼듯 왼쪽으로 6px, 등이 넓어진다 */
:is(.send,.btn,.icon-btn,.chip,.opt,.pick,.clip,.stopbtn,.room,.swatches button){transition:transform .15s,box-shadow .15s,background-color .15s}
:is(.send,.btn,.icon-btn,.chip,.opt,.pick,.clip,.stopbtn,.room,.swatches button):active:not(:disabled){transform:translateX(-6px)}
:is(.send,.btn.pri):active:not(:disabled){box-shadow:inset -6px 0 0 var(--edge)}
.tabs button:active{transform:translateY(-3px)}
/* 새 화면(대화방)은 책등 쪽에서 밀려 들어온다 — 책등은 그대로 */
#log.slide{animation:slidein .32s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#log.slide{animation:none}*,*::before,*::after{transition:none!important}:active{transform:none!important}}
/* 펫이 어두운 바탕에서 묻히지 않게 조금 밝게 */
:root[data-theme=dark] .petstage .art :is(.skin-img,.skin-media:not(.skin-fx)){filter:brightness(1.15)!important}
/* 바탕·강조·밝기 고르기 칸 */
.swatches i{border-color:color-mix(in srgb,var(--text) 25%,transparent)}
/* 강조 「직접」 — 색상표(input type=color)를 칸 안에 감춰 두고 칸을 누르면 열린다 */
.swatches label.custom{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--field);padding:5px 10px;margin:0;font-size:13px;font-weight:400;color:var(--muted);cursor:pointer;
  transition:transform .15s}
.swatches label.custom:active{transform:translateX(-6px)}
.swatches label.custom.on{background:var(--spine);border:1px solid var(--spine);color:var(--onspine)}
.swatches label.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.swatches label.custom i{width:13px;height:13px;flex:none;border:1px solid color-mix(in srgb,var(--text) 25%,transparent)}
#lookCustomPrev,#lookBgPrev{display:flex;align-items:center;gap:4px}
#lookCustomPrev[hidden],#lookBgPrev[hidden]{display:none}
:is(#lookCustomPrev,#lookBgPrev) i{width:13px;height:13px;flex:none;border:1px solid color-mix(in srgb,var(--text) 25%,transparent)}
</style>
<link rel="stylesheet" href="pet/pets.css">
</head>
<body>
<header>
  <button class="back" id="backBtn" aria-label="대화 목록으로" style="display:none">‹</button>
  <div class="logo" id="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></div>
  <div class="ttl"><h1 id="ttl">D&amp;C 메신저</h1><div class="sub" id="who">메일로 일을 맡깁니다</div></div>
  <button class="icon-btn" id="pinBtn" aria-label="이 대화 고정" style="display:none">고정</button>
  <button class="icon-btn" id="delBtn" aria-label="이 대화 지우기" style="display:none">지우기</button>
  <button class="icon-btn" id="setBtn" aria-label="설정">설정</button>
</header>

<div class="petstage off" id="petStage">
  <div class="pet dog" id="pDog"><div class="art" id="pDogArt"></div></div>
  <div class="pet cat" id="pCat"><div class="art" id="pCatArt"></div></div>
</div>
<div id="searchBar"><input type="search" id="q" placeholder="대화 찾기 (제목·내용)" autocomplete="off" enterkeyhint="search"></div>
<div id="gbar"><span id="gbarText"></span><button class="btn" id="gbarBtn">다시 연결</button></div>
<div id="sumBar" role="group" aria-label="대화 요약"></div>
<main id="log" aria-live="polite"></main>

<div class="composer">
  <div class="tabs" role="tablist">
    <button data-pane="say" class="on">지시</button>
    <button data-pane="answer">답하기</button>
  </div>

  <!-- 지시: 새 일을 맡기거나, 대화 번호를 넣어 이어서 말한다 -->
  <section class="pane on" id="say">
    <div class="quick" id="quick" style="display:none"></div>
    <div class="chips" id="modeChips">
      <button class="chip on" data-mode="read">읽기</button>
      <button class="chip w" data-mode="write">수정 허용</button>
      <button class="chip" id="doneChip" title="다 됐다고 볼 조건 — 끝낼 때 하나씩 ✅/❌ 로 점검해 답합니다">완료 기준</button>
      <span style="width:6px"></span>
      <span id="folderChips" style="display:contents"></span>
    </div>
    <div class="inline" id="sayRow">
      <label for="sayThread">이어서</label>
      <div class="prefix" style="max-width:130px"><span>T</span><input id="sayThread" type="number" inputmode="numeric" placeholder="새 대화"></div>
      <span class="hint" style="margin:0">비우면 새 대화</span>
    </div>
    <div id="attPrev" style="display:none"></div>
    <div class="row">
      <button class="clip" id="clipBtn" aria-label="사진 붙이기" style="display:none">📎</button>
      <input type="file" id="clipIn" accept="image/*" multiple hidden>
      <textarea id="sayText" rows="1" placeholder="할 일을 적으세요 (첫 줄이 제목 · Jira 는 /jira 키)"></textarea>
      <button class="send" id="saySend" aria-label="보내기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div id="doneBox"><textarea id="doneText" rows="2" placeholder="완료 기준 — 한 줄에 하나 (예: 시험 모두 통과)"></textarea></div>
  </section>

  <!-- 답하기: 메일로 온 질문(☐ 1~4)에 체크박스로 답한다 -->
  <section class="pane" id="answer">
    <div class="inline" id="ansRow">
      <label for="ansThread">대화</label>
      <div class="prefix" style="max-width:130px"><span>T</span><input id="ansThread" type="number" inputmode="numeric" placeholder="12"></div>
      <span class="hint" style="margin:0">권한은 처음 그대로</span>
    </div>
    <div class="picks" id="picks"></div>
    <div class="row">
      <textarea id="ansText" rows="1" placeholder="덧붙일 말 (없어도 됨)"></textarea>
      <button class="send" id="ansSend" aria-label="보내기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="hint">메일 제목의 <b>[T번호]</b> 를 넣고 고르세요. 여러 개 고를 수 있습니다. <button class="stopbtn" id="stopBtn">멈춤</button></div>
  </section>
</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="setForm">
    <h2>설정</h2>
    <p>이 기기에만 저장됩니다. 페이지에는 아무 주소도 들어 있지 않습니다.</p>
    <div class="field"><label for="setMail">지시를 받을 메일 주소 (PC 게이트웨이가 보는 내 주소)</label>
      <input id="setMail" type="email" autocomplete="email" placeholder="me@company.com" required></div>
    <div class="field"><label for="setFolders">작업 폴더 키 (쉼표로, 비우면 기본 폴더만)</label>
      <input id="setFolders" type="text" placeholder="hub, mobile"></div>
    <div class="field"><label for="setKey">암호 단어 (폰 기본 메일이 iCloud 같은 개인 주소일 때)</label>
      <div class="row" style="display:flex;gap:6px"><input id="setKey" type="password" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="PC 에서 알려 준 단어" style="flex:1">
        <button type="button" id="setKeyShow">보기</button></div>
      <div class="hint" style="margin-top:4px">보낼 때 제목 끝에 자동으로 붙습니다. PC 가 개인 주소에서 온 지시를 이 단어로 확인합니다.</div></div>
    <div class="field"><label for="setGcid">Google 클라이언트 ID (Gmail 로 주고받기 — 비우면 메일 앱)</label>
      <input id="setGcid" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="….apps.googleusercontent.com">
      <div class="hint" style="margin-top:4px" id="gHint">넣고 저장하면 Google 로그인 화면이 열립니다. 그 Gmail 로 보내고, PC 의 답이 여기 말풍선으로 옵니다.</div>
      <button type="button" class="btn" id="gOff" style="width:100%;margin-top:6px;display:none">Gmail 연결 끊기 (이 기기에서만)</button>
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:10px"><input type="checkbox" id="setViaApp" style="margin-top:3px">
        <span>새 지시는 메일 앱(iCloud)으로 보내기<br><span class="hint" style="margin:0">회사 메일이 Gmail 새 지시를 스팸으로 붙잡아서 — 이어 말하기·답하기는 그대로 여기서 바로 갑니다</span></span></label>
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:10px"><input type="checkbox" id="setSelf" style="margin-top:3px">
        <span>PC 가 내 Gmail 을 직접 읽어요 — 전부 나에게 보내기<br><span class="hint" style="margin:0">PC 에 Gmail 앱 비밀번호를 넣은 뒤 켜세요. 회사 메일을 안 거쳐 새 지시도 바로 가고, 위 메일 앱 설정은 쓰지 않습니다</span></span></label></div>
    <div class="field"><label for="dogBreed">강아지 · 고양이 (이 기기에만 기억)</label>
      <div style="display:flex;gap:8px"><select id="petSkinSel" title="모습 — 인형 · 만화" style="flex:0 0 auto;width:auto"></select><select id="dogBreed"></select><select id="catBreed"></select></div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:8px"><input type="checkbox" id="petShow"> 화면에 보이기</label></div>
    <div class="field"><label>바탕 (이 기기에만 기억)</label>
      <div class="swatches" id="lookTheme"></div>
      <div class="hint lookprev" id="lookBgPrev" hidden><i></i><i></i> 밝게·어둡게에선 이렇게 보여요</div></div>
    <div class="field"><label>강조색</label>
      <div class="swatches" id="lookAccent"></div>
      <div class="hint lookprev" id="lookCustomPrev" hidden><i></i><i></i> 밝게·어둡게에선 이렇게 보여요</div></div>
    <div class="field"><label>화면 밝기 (자동은 저녁 7시~아침 7시 어둡게)</label>
      <div class="swatches" id="lookMode"></div></div>
    <div class="field"><button type="button" class="btn" id="clearSent" style="width:100%">보낸 기록 모두 지우기 (이 기기에서만)</button></div>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>닫기</button><button class="btn pri" value="ok">저장</button></div>
  </form>
</dialog>
<div id="editBar">
  <button class="btn" id="selAll">모두 선택</button>
  <button class="btn danger" id="selDel" disabled>지우기</button>
</div>
<dialog id="infoDlg" aria-label="대화 상세"><button class="x" id="infoX" aria-label="닫기">✕</button><div id="infoBody"></div></dialog>
<div id="toast"></div>
<div class="spine" aria-hidden="true"><b class="vt">메신저</b><small>D&amp;C</small></div>
<script src="pet/petwarp.js"></script>
<script src="pet/pets.js"></script>

<script src="app.js"></script>
</body>
</html>
